# DQN Agent Hyperparameters
# Ref: Stable-Baselines3 DQN documentation

model:
  policy: "MlpPolicy"           # Multi-layer perceptron policy
  learning_rate: 1.0e-4         # Adam optimizer learning rate
  buffer_size: 50000            # Replay buffer capacity
  learning_starts: 1000         # Steps before training begins
  batch_size: 32                # Mini-batch size for gradient updates
  tau: 1.0                      # Soft update coefficient for target network
  gamma: 0.99                   # Discount factor for future rewards
  train_freq: 4                 # Update model every N steps
  gradient_steps: 1             # Gradient steps per update
  target_update_interval: 1000  # Steps between target network hard updates
  exploration_fraction: 0.3     # Fraction of training with epsilon decay
  exploration_initial_eps: 1.0  # Starting epsilon (fully random)
  exploration_final_eps: 0.05   # Final epsilon (5% random actions)
  verbose: 1

  # Neural network architecture (hidden layers for MlpPolicy)
  policy_kwargs:
    net_arch: [64, 64]          # Two hidden layers of 64 units each

training:
  total_timesteps: 100000       # Total environment steps for training
  eval_freq: 5000               # Evaluate on validation set every N steps
  n_eval_episodes: 1            # Episodes per evaluation
  save_freq: 10000              # Save checkpoint every N steps
  patience: 5                   # Evals with no improvement before early stop
  seed: 42

environment:
  initial_balance: 10000.0      # Starting cash in USDT
  transaction_cost: 0.001       # 0.1% fee per Buy or Sell
